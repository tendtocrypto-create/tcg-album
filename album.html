<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Kartensammlung - Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
            margin-bottom: 10px;
        }

        .input-section {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 30px;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        input[type="text"] {
            width: 400px;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 2px solid #555;
            background: #111;
            color: white;
            outline: none;
            margin-right: 10px;
        }

        input[type="text"]:focus {
            border-color: #f1c40f;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Russo One', sans-serif;
            background: #f1c40f;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #d4ac0d;
        }

        #userWelcome {
            font-size: 18px;
            color: #00ffcc;
            margin-top: 15px;
            font-weight: bold;
            font-family: 'Russo One', sans-serif;
        }

        .collection-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Kartenelement */
        .card-slot {
            width: 170px;
            height: 285px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 3px solid #333;
            box-sizing: border-box;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .rarity-header {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .image-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            width: 100%;
            height: 210px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .card-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            width: 100%;
        }

        /* Gesperrte Karte */
        .card-slot.locked {
            opacity: 0.75;
        }
        .card-slot.locked .image-wrapper img {
            filter: brightness(0.6);
        }

        /* Seltenheits-Rahmen */
        .slot-Common { border-color: #888888; }
        .slot-Uncommon { border-color: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.3); }
        .slot-Rare { border-color: #3498db; box-shadow: 0 0 10px rgba(52,152,219,0.3); }
        .slot-Super-Rare { border-color: #9b59b6; box-shadow: 0 0 14px rgba(155,89,182,0.6); }
        .slot-Ultra-Rare { border-color: #f1c40f; box-shadow: 0 0 20px rgba(241,196,15,0.8); }

        .text-Common { color: #aaaaaa; }
        .text-Uncommon { color: #2ecc71; }
        .text-Rare { color: #3498db; }
        .text-Super-Rare { color: #9b59b6; }
        .text-Ultra-Rare { color: #f1c40f; }

        .info-text {
            color: #888;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Meine TCG Kartensammlung</h1>
    
    <div class="input-section">
        <p style="margin-top:0; font-size: 14px; color:#ccc;">Tippe hier die komplette Zeile aus dem Twitch chat ein:</p>
        <input type="text" id="cardCodesInput" placeholder="Name und Codes eingeben...">
        <button onclick="loadCollection()">Album anzeigen</button>
        <div id="userWelcome"></div>
    </div>

    <div class="collection-grid" id="collectionGrid">
        <div class="info-text">Lade alle Karten...</div>
    </div>

    <script src="cards.js"></script>
    <script>
        function getDatabase() {
            if (typeof cardDatabase !== 'undefined') return cardDatabase;
            if (typeof cards !== 'undefined') return cards;
            if (typeof allCards !== 'undefined') return allCards;
            return [];
        }

        window.onload = function() {
            renderAlbum([]);
        };

        function loadCollection() {
            let rawInput = document.getElementById('cardCodesInput').value.trim();
            const welcomeEl = document.getElementById('userWelcome');
            welcomeEl.innerHTML = '';

            if (!rawInput) {
                renderAlbum([]);
                return;
            }

            let twitchName = "";
            let codesString = rawInput;

            let firstSpace = rawInput.indexOf(' ');
            if (firstSpace !== -1) {
                let potentialName = rawInput.substring(0, firstSpace).trim();
                let potentialCodes = rawInput.substring(firstSpace + 1).trim();
                
                if (/\d/.test(potentialCodes)) {
                    twitchName = potentialName;
                    codesString = potentialCodes;
                    welcomeEl.innerHTML = `Sammlung von: ${twitchName}`;
                }
            }

            codesString = codesString.replace(/^[:,\s]+/, '');
            let userIds = codesString.split(',').map(id => String(id.trim())).filter(id => id !== '');

            renderAlbum(userIds);
        }

        function renderAlbum(unlockedIds) {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';

            const db = getDatabase();
            if (db.length === 0) {
                grid.innerHTML = '<div class="info-text" style="color:#e74c3c;">Fehler: Konnte keine Kartendaten in cards.js finden!</div>';
                return;
            }

            db.forEach(card => {
                const cardIdVal = String(card.cardId || card.id);
                const isUnlocked = unlockedIds.includes(cardIdVal);

                const rarity = card.rarity || 'Common';
                const raritySlug = rarity.replace(' ', '-');
                const textClass = `text-${raritySlug}`;
                const cardNameVal = card.cardName || card.name || 'Unbekannt';

                const cardDiv = document.createElement('div');

                if (isUnlocked) {
                    const imagePath = `images/${cardIdVal}.png`;
                    cardDiv.className = `card-slot slot-${raritySlug}`;
                    cardDiv.innerHTML = `
                        <div class="card-inner">
                            <div class="rarity-header ${textClass}">${rarity}</div>
                            <div class="image-wrapper">
                                <img src="${imagePath}" alt="${cardNameVal}" onerror="this.src='placeholder.png'">
                            </div>
                            <div class="card-name">${cardNameVal}</div>
                        </div>
                    `;
                } else {
                    cardDiv.className = `card-slot locked slot-${raritySlug}`;
                    cardDiv.innerHTML = `
                        <div class="card-inner">
                            <div class="rarity-header ${textClass}">${rarity}</div>
                            <div class="image-wrapper">
                                <img src="kartenruecken.png" alt="Versteckt" onerror="this.src='placeholder.png'">
                            </div>
                            <div class="card-name" style="color: #666;">#${cardIdVal} Unbekannt</div>
                        </div>
                    `;
                }

                grid.appendChild(cardDiv);
            });
        }
    </script>
</body>
</html>
