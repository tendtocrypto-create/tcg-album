<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <base href="./">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Community Sammelalbum</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: white;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            color: #d296f5;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(155, 89, 182, 0.4);
        }

        /* Suchleiste / Namens-Eingabe */
        .search-box {
            background: rgba(25, 25, 25, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        input {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            outline: none;
            width: 220px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #8e44ad;
        }

        #status-msg {
            margin-bottom: 25px;
            font-size: 14px;
            color: #aaa;
        }

        /* Das Karten-Grid (Clean & Modern) */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .album-card {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .album-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 6px;
            margin-bottom: 8px;
            /* Nicht freigeschaltete Karten werden dunkel und schwarz-weiß dargestellt */
            filter: grayscale(100%) brightness(0.3);
            transition: filter 0.3s;
        }

        /* Wenn die Karte gesammelt wurde */
        .album-card.unlocked img {
            filter: none;
        }

        .album-card.unlocked {
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.25);
        }

        .card-number {
            font-size: 11px;
            color: #777;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #fff;
        }
    </style>
</head>

    <div id="status-msg">Gib deinen Twitch-Namen ein, um deine Sammlung zu laden.</div>

    <div class="search-box">
        <input type="text" id="usernameInput" placeholder="Twitch Name..." onkeydown="if(event.key === 'Enter') loadCollection()">
        <button onclick="loadCollection()">Album laden</button>
    </div>

    <!-- Hier landen dynamisch alle 100 Karten -->
    <div class="album-grid" id="albumGrid"></div>

        // Grid aufbauen: Holt sich die Namen automatisch aus deiner cards.js
        function initGrid(unlockedIds = []) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 100; i++) {
                const isUnlocked = unlockedIds.includes(i.toString());
                
                let cardName = `Karte #${i}`;
                if (typeof window.allCards !== 'undefined') {
                    const found = window.allCards.find(c => c.cardId == i || c.id == i);
                    if (found) cardName = found.cardName || found.name;
                } else if (typeof window.cards !== 'undefined') {
                    const found = window.cards.find(c => c.cardId == i || c.id == i);
                    if (found) cardName = found.cardName || found.name;
                }

                let imageUrl = cardImages[i];
                if (!imageUrl || imageUrl.trim() === "") {
                    imageUrl = `https://placehold.co/150x200/222/FFF?text=Card+${i}`;
                }

                const cardDiv = document.createElement('div');
                cardDiv.className = `album-card ${isUnlocked ? 'unlocked' : ''}`;
                cardDiv.innerHTML = `
                    <div class="card-number">#${i}</div>
                    <img src="${imageUrl}" alt="${cardName}" onerror="this.src='https://placehold.co/150x200/222/FFF?text=Error'">
                    <div class="card-name">${cardName}</div>
                `;
                grid.appendChild(cardDiv);
            }
        }

        // Lädt die User-Daten vom Server (Sicher mit Kleinbuchstaben & ohne Leerzeichen)
        async function loadCollection() {
            let rawInput = document.getElementById('usernameInput').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!rawInput) {
                alert("Bitte gib einen Namen ein!");
                return;
            }

            const username = rawInput.toLowerCase();

            statusMsg.innerText = `Lade Sammlung von ${rawInput}...`;

            try {
                const response = await fetch(`users/${username}.json?` + Date.now());
                
                if (response.ok) {
                    const unlockedCards = await response.json(); 
                    initGrid(unlockedCards);
                    statusMsg.innerText = `Sammlung von ${rawInput} geladen! (${unlockedCards.length} / 100 Karten gesammelt)`;
                } else {
                    initGrid([]);
                    statusMsg.innerText = `Keine gespeicherte Sammlung für "${rawInput}" gefunden. Öffne erst ein Booster im Stream!`;
                }
            } catch (err) {
                if (username === "alex") {
                    initGrid(["1", "2", "5", "10", "42"]);
                    statusMsg.innerText = `[TEST-MODUS] Simulierte Sammlung für ${rawInput} geladen.`;
                } else {
                    initGrid([]);
                    statusMsg.innerText = `Keine Daten gefunden für "${rawInput}".`;
                }
            }
        }

        // Inititales leeres Grid beim Aufruf anzeigen
        initGrid([]);
